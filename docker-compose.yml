# StudyMate AI — environnement complet sous Docker
#   docker compose up -d --build
# Web : http://localhost:8088   API : http://localhost:4000   Doc API : http://localhost:4000/api/docs
name: studymate

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-studymate}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-studymate}?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?définir JWT_ACCESS_SECRET dans .env}
  FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:?définir FILE_TOKEN_SECRET dans .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8088}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://storage:8333
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-studymate-documents}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-studymate}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?définir S3_SECRET_ACCESS_KEY dans .env}
  S3_FORCE_PATH_STYLE: "true"
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  AI_EFFORT: ${AI_EFFORT:-medium}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-60}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Le lien de réinitialisation du mot de passe est écrit dans les journaux (aucun service e-mail).
  MAIL_PROVIDER: console

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studymate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-studymate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studymate} -d ${POSTGRES_DB:-studymate}"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    # Stockage objet compatible S3 (SeaweedFS). En production : Amazon S3 ou équivalent.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/studymate/start.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-studymate}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - objects:/data
      - ./infrastructure/docker/storage/start.sh:/opt/studymate/start.sh:ro
    # Stockage privé : non exposé hors du réseau Docker. Les fichiers ne sont servis que par l'API.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: studymate-backend:local
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_healthy }
    ports:
      - "4000:4000"

  worker:
    image: studymate-backend:local
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      disable: true

  # Tests du backend dans Docker : docker compose --profile test run --rm backend-tests
  backend-tests:
    profiles: [test]
    build: { context: ., dockerfile: backend/Dockerfile, target: test }
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-studymate}:${POSTGRES_PASSWORD}@db:5432/studymate_test?schema=public
    depends_on:
      db: { condition: service_healthy }

  # Construction de l'APK : docker compose --profile android run --rm android-build
  android-build:
    profiles: [android]
    build: ./infrastructure/docker/android
    environment:
      STUDYMATE_API_URL: ${STUDYMATE_API_URL:-http://10.0.2.2:4000/}
    volumes:
      - ./android:/src
      - gradle-cache:/root/.gradle

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8088:80"

volumes:
  pgdata:
  objects:
  gradle-cache:
