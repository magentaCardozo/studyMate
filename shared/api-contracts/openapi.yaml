openapi: 3.1.0
info:
  title: StudyMate AI — API REST
  version: 1.0.0
  description: |
    Contrat partagé par le client web (React) et l'application Android (Kotlin).

    **Authentification**
    - Web : cookies HttpOnly `sm_access` / `sm_refresh` (SameSite=Strict). Les requêtes modifiantes
      authentifiées par cookie doivent envoyer l'en-tête `X-Requested-With: StudyMate`.
    - Android : envoyer `X-Client: android` à la connexion ; les jetons sont renvoyés dans le corps.
      Utiliser `Authorization: Bearer <accessToken>` ; rafraîchir via `POST /auth/refresh` avec `{ refreshToken }`.
      Les jetons de rafraîchissement sont à usage unique (rotation) ; une réutilisation révoque la session.

    **Format des réponses** : `{ "data": …, "meta"?: { page, pageSize, total, totalPages } }`.
    **Format des erreurs** : `{ "error": { "code": "…", "message": "…", "details"?: … } }`.
    Une ressource appartenant à un autre utilisateur renvoie **404**.

    **Pagination** : `?page=1&pageSize=20` (max 100) sur les collections volumineuses.
servers:
  - url: /api/v1
security:
  - bearer: []
  - cookie: []
tags:
  - { name: Auth }
  - { name: Utilisateur }
  - { name: Organisation académique }
  - { name: Matières, description: 'Dossiers de premier niveau (bases de connaissances) — ressource /courses.' }
  - { name: Dossiers }
  - { name: Leçons }
  - { name: Documents }
  - { name: Notes }
  - { name: IA et révision }
  - { name: Cartes mémoire }
  - { name: Quiz }
  - { name: Coach }
  - { name: Progression }
  - { name: Recherche et notifications }
  - { name: Synchronisation }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    cookie: { type: apiKey, in: cookie, name: sm_access }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CourseId: { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Error:
      description: Erreur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent: { description: Succès sans contenu }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR, NOT_FOUND, UNAUTHORIZED, TOKEN_EXPIRED, RATE_LIMITED, AI_CONSENT_REQUIRED, INSUFFICIENT_CONTENT] }
            message: { type: string }
            details: {}
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        preferredLanguage: { type: string, enum: [fr, en] }
        timezone: { type: string }
        faculty: { type: [string, 'null'] }
        settings: { type: object }
        aiConsentAt: { type: [string, 'null'], format: date-time }
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string, description: Android uniquement }
        refreshToken: { type: string, description: Android uniquement }
        accessExpiresIn: { type: integer }
    Course:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        code: { type: [string, 'null'] }
        faculty: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        importance: { type: integer, minimum: 1, maximum: 5 }
        confidence: { type: [integer, 'null'] }
        isDemo: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
        semester: { type: [object, 'null'] }
        academicYear: { type: [object, 'null'] }
        stats:
          type: object
          properties:
            folders: { type: integer }
            lessons: { type: integer }
            documents: { type: integer }
            completedLessons: { type: integer }
            progress: { type: [integer, 'null'], description: Null tant qu'aucune leçon n'existe }
        lastActivityAt: { type: [string, 'null'], format: date-time }
    CourseInput:
      type: object
      required: [title]
      properties:
        id: { type: string, format: uuid, description: Identifiant généré par le client (optionnel) }
        title: { type: string, maxLength: 160 }
        code: { type: string }
        faculty: { type: string }
        description: { type: string }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        semesterId: { type: string, format: uuid }
        importance: { type: integer }
        confidence: { type: integer }
    TreeFolder:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        parentFolderId: { type: [string, 'null'] }
        counts: { type: object, properties: { lessons: { type: integer }, documents: { type: integer }, subfolders: { type: integer } } }
        children: { type: array, items: { $ref: '#/components/schemas/TreeFolder' } }
        lessons: { type: array, items: { type: object } }
    Folder:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        parentFolderId: { type: [string, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        sortOrder: { type: integer }
    Lesson:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        folderId: { type: [string, 'null'] }
        title: { type: string }
        description: { type: [string, 'null'] }
        content: { type: string, description: Markdown avec mathématiques ($…$) }
        learningObjectives: { type: array, items: { type: string } }
        definitions: { type: array, items: { $ref: '#/components/schemas/Item' } }
        formulas: { type: array, items: { $ref: '#/components/schemas/Item' } }
        examples: { type: array, items: { $ref: '#/components/schemas/Item' } }
        exercises: { type: array, items: { $ref: '#/components/schemas/Item' } }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED] }
        estimatedMinutes: { type: [integer, 'null'] }
        revisionDate: { type: [string, 'null'], format: date-time }
    Item: { type: object, properties: { title: { type: string }, body: { type: string } } }
    Document:
      type: object
      properties:
        id: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        fileSize: { type: integer }
        courseId: { type: string, description: Dossier de la base de connaissances (obligatoire) }
        folderId: { type: [string, 'null'], description: Sous-dossier facultatif }
        source: { type: string, enum: [file, scan, text], description: 'Mode d''ajout : fichier (PDF…), scan, texte collé' }
        processingStatus: { type: string, enum: [PENDING_UPLOAD, UPLOADED, QUEUED, PROCESSING, READY, FAILED] }
        processingError: { type: [string, 'null'] }
        extractionMethod: { type: [string, 'null'], enum: [pdf-text, pdf-ocr, docx, text, image-ocr, null] }
        pageCount: { type: [integer, 'null'] }
        pinned: { type: boolean }
    Note:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string, description: Markdown }
        courseId: { type: [string, 'null'] }
        folderId: { type: [string, 'null'] }
        lessonId: { type: [string, 'null'] }
        documentId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    SourceRef:
      type: object
      description: Provenance d'un contenu généré. `page` est null quand l'extraction ne fournit pas de pagination fiable.
      properties:
        sourceId: { type: string }
        kind: { type: string, enum: [document, lesson] }
        documentId: { type: [string, 'null'] }
        lessonId: { type: [string, 'null'] }
        title: { type: string }
        page: { type: [integer, 'null'] }
    Scope:
      type: object
      description: Portée des sources (au moins un champ).
      properties:
        courseId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        documentIds: { type: array, items: { type: string, format: uuid }, maxItems: 20 }
    Flashcard:
      type: object
      properties:
        id: { type: string }
        deckId: { type: string }
        question: { type: string }
        answer: { type: string }
        sourceReference: { oneOf: [{ $ref: '#/components/schemas/SourceRef' }, { type: 'null' }] }
        difficulty: { type: [integer, 'null'] }
        tags: { type: array, items: { type: string } }
        easeFactor: { type: number }
        intervalDays: { type: number }
        repetitions: { type: integer }
        dueAt: { type: string, format: date-time }
    Question:
      type: object
      description: |
        Formats de `correctAnswer` / réponse : SINGLE_CHOICE → index ; MULTIPLE_CHOICE → index[] ;
        TRUE_FALSE → booléen ; SHORT_ANSWER / FILL_BLANK → chaînes acceptées / chaîne ;
        MATCHING → `options = {left, right}`, réponse = index de droite pour chaque élément de gauche.
        `correctAnswer` et `explanation` sont absents tant qu'une tentative en mode examen n'est pas soumise.
      properties:
        id: { type: string }
        ordinal: { type: integer }
        question: { type: string }
        questionType: { type: string, enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, SHORT_ANSWER, FILL_BLANK, MATCHING] }
        options: {}
        points: { type: number }
        correctAnswer: {}
        explanation: { type: string }
        uncertain: { type: boolean }
        sourceReference: {}
    StudySession:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        lessonId: { type: [string, 'null'] }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: string, format: date-time }
        activityType: { type: string, enum: [lesson, flashcards, quiz, mock_exam, summary, free] }
        objective: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: Explication de la recommandation }
        origin: { type: string, enum: [manual, plan] }
        status: { type: string, enum: [PLANNED, COMPLETED, SKIPPED, MISSED] }
    SyncOperation:
      type: object
      required: [opId, entity, action, id]
      properties:
        opId: { type: string, format: uuid, description: Clé d'idempotence }
        entity: { type: string, enum: [note, lesson, course, folder, flashcard, flashcard_review, session, quiz_result] }
        action: { type: string, enum: [create, update, delete] }
        id: { type: string, format: uuid }
        data: { type: object }
        baseUpdatedAt: { type: [string, 'null'], format: date-time, description: Version serveur connue lors de la modification locale }
        clientTime: { type: string, format: date-time }

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Créer un compte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: Au moins une lettre et un chiffre }
                preferredLanguage: { type: string, enum: [fr, en] }
                timezone: { type: string }
      responses:
        '201': { description: 'Compte créé', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Session' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Se connecter
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses:
        '200': { description: 'Connecté', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Session' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rafraîchir la session (rotation du jeton)
      requestBody: { content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string, description: Android uniquement ; le web utilise le cookie } } } } } }
      responses:
        '200': { description: Nouveaux jetons }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post: { tags: [Auth], security: [], summary: 'Se déconnecter (révocation du jeton de rafraîchissement)', responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /auth/logout-all:
    post: { tags: [Auth], summary: 'Déconnecter tous les appareils', responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /auth/password-reset/request:
    post:
      tags: [Auth]
      security: []
      summary: Demander un lien de réinitialisation (réponse identique que le compte existe ou non)
      requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }
      responses: { '202': { description: Accepté } }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Définir un nouveau mot de passe
      requestBody: { content: { application/json: { schema: { type: object, properties: { token: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: Mot de passe mis à jour }, '400': { $ref: '#/components/responses/Error' } }

  /users/me:
    get: { tags: [Utilisateur], summary: 'Profil', responses: { '200': { description: Profil } } }
    patch: { tags: [Utilisateur], summary: 'Modifier le profil (nom, langue, fuseau, faculté, établissement)', responses: { '200': { description: Profil } } }
    delete:
      tags: [Utilisateur]
      summary: Supprimer définitivement le compte et tous les documents
      requestBody: { content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses: { '204': { $ref: '#/components/responses/NoContent' } }
  /users/me/settings:
    patch: { tags: [Utilisateur], summary: 'Préférences (disponibilités, durée de session, notifications, heures calmes, hors ligne)', responses: { '200': { description: OK } } }
  /users/me/ai-consent:
    post: { tags: [Utilisateur], summary: 'Accorder ou retirer le consentement au traitement par un fournisseur d''IA tiers', responses: { '200': { description: OK } } }
  /users/me/export:
    get: { tags: [Utilisateur], summary: 'Exporter toutes ses données (JSON)', responses: { '200': { description: Export } } }
  /users/me/demo-content:
    post: { tags: [Utilisateur], summary: 'Ajouter le contenu de démonstration (marqué « démo »)', responses: { '201': { description: Créé } } }
    delete: { tags: [Utilisateur], summary: 'Supprimer le contenu de démonstration', responses: { '204': { $ref: '#/components/responses/NoContent' } } }

  /academic-years:
    get: { tags: [Organisation académique], summary: 'Années académiques et semestres', responses: { '200': { description: Liste } } }
    post: { tags: [Organisation académique], summary: 'Créer une année (option semesters[])', responses: { '201': { description: Créée } } }
  /academic-years/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch: { tags: [Organisation académique], summary: 'Modifier', responses: { '200': { description: OK } } }
    delete: { tags: [Organisation académique], summary: 'Supprimer', responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /semesters:
    get: { tags: [Organisation académique], summary: 'Semestres (?academicYearId=)', responses: { '200': { description: Liste } } }
    post: { tags: [Organisation académique], summary: 'Créer un semestre', responses: { '201': { description: Créé } } }
  /semesters/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch: { tags: [Organisation académique], summary: 'Modifier', responses: { '200': { description: OK } } }
    delete: { tags: [Organisation académique], summary: 'Supprimer', responses: { '204': { $ref: '#/components/responses/NoContent' } } }

  /courses:
    get:
      tags: [Matières]
      summary: Lister les matières
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: q, in: query, schema: { type: string } }
        - { name: semesterId, in: query, schema: { type: string, format: uuid } }
        - { name: academicYearId, in: query, schema: { type: string, format: uuid } }
        - { name: archived, in: query, schema: { type: string, enum: ['true', 'false', all], default: 'false' } }
        - { name: sort, in: query, schema: { type: string, enum: [alpha, recent], default: recent } }
      responses: { '200': { description: 'Liste paginée', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Course' } }, meta: { type: object } } } } } } }
    post:
      tags: [Matières]
      summary: Créer une matière
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CourseInput' } } } }
      responses: { '201': { description: Créée }, '400': { $ref: '#/components/responses/Error' } }
  /courses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { tags: [Matières], summary: 'Détail avec arborescence (tree) générée depuis la base', responses: { '200': { description: Matière }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Matières], summary: 'Modifier / archiver ({ archived: true })', responses: { '200': { description: OK } } }
    delete: { tags: [Matières], summary: 'Supprimer (documents compris)', responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /courses/{id}/knowledge-base:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Matières]
      summary: 'État de la base de connaissances du dossier (documents par source et par état, volume de texte, canGenerate)'
      responses: { '200': { description: OK } }
  /review:
    get:
      tags: [Révision]
      summary: 'Onglet Révisions : QCM à terminer (tentative en cours ou jamais commencés), questions ratées (dernière réponse fausse), flash-cards à réviser'
      responses:
        '200':
          description: 'JSON { toFinish: [{ quizId, title, course, isMockExam, isReview, totalQuestions, status: in_progress|not_started, attemptId, answered, startedAt }], mistakes: [{ questionId, question, quiz, course, wrongCount, lastAnsweredAt }], cards: { due, new } }'
  /review/mistakes-quiz:
    post:
      tags: [Révision]
      summary: 'Crée un QCM de rattrapage (hors dossier, mode entraînement) avec les questions ratées ; les copies gardent originQuestionId. Remplace un rattrapage précédent resté sans réponse.'
      requestBody: { content: { application/json: { schema: { type: object, properties: { courseId: { type: string, format: uuid }, questionIds: { type: array, items: { type: string, format: uuid } } } } } } }
      responses:
        '201': { description: '{ id, title, questions }' }
        '400': { description: 'NO_MISTAKES : aucune question ratée' }
  /courses/{id}/knowledge-base/content:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Matières]
      summary: 'Base de connaissances réunie : texte extrait de tous les documents prêts du dossier (fichiers, scans, textes collés), page par page'
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [md] }, description: 'md : téléchargement Markdown' }
      responses:
        '200':
          description: 'JSON { courseId, title, characters, documents: [{ id, fileName, source, pageCount, createdAt, corrected, warnings, pages: [{ page, text, source, aVerifier, texteImages }] }], pending } ou fichier text/markdown'
  /courses/{id}/revisions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Matières]
      summary: 'Les trois sous-dossiers fixes du dossier (QCM, Flash-cards, Fiches de révision), contenu du plus récent au plus ancien'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      courseId: { type: string, format: uuid }
                      qcm: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, createdAt: { type: string, format: date-time }, questions: { type: integer }, lastScore: { type: integer, nullable: true } } } }
                      flashcards: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, createdAt: { type: string, format: date-time }, cards: { type: integer } } } }
                      fiches: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, createdAt: { type: string, format: date-time }, length: { type: string } } } }
  /courses/{id}/tree:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { tags: [Matières], summary: 'Arborescence dossiers / leçons', responses: { '200': { description: 'Arbre', content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { folders: { type: array, items: { $ref: '#/components/schemas/TreeFolder' } }, lessons: { type: array, items: { type: object } } } } } } } } } } }

  /courses/{courseId}/folders:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get: { tags: [Dossiers], summary: 'Dossiers de la matière (liste à plat)', responses: { '200': { description: Liste } } }
    post:
      tags: [Dossiers]
      summary: Créer un dossier (parentFolderId pour un sous-dossier)
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string }, parentFolderId: { type: string }, color: { type: string } } } } } }
      responses: { '201': { description: Créé } }
  /courses/{courseId}/folders/reorder:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post: { tags: [Dossiers], summary: 'Réordonner des dossiers de même niveau', requestBody: { content: { application/json: { schema: { type: object, properties: { folderIds: { type: array, items: { type: string } } } } } } }, responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /folders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { tags: [Dossiers], summary: 'Contenu du dossier (sous-dossiers, leçons, documents, notes, fil d’Ariane ; ?q= pour filtrer)', responses: { '200': { description: Dossier } } }
    patch: { tags: [Dossiers], summary: 'Renommer / déplacer (parentFolderId) / réordonner / archiver', responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Dossiers], summary: 'Supprimer (sous-dossiers et leçons ; documents conservés)', responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /folders/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { tags: [Dossiers], summary: 'Dupliquer la structure (sans contenu)', responses: { '201': { description: Copie } } }

  /courses/{courseId}/lessons:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get: { tags: [Leçons], summary: 'Leçons (?folderId=&status=)', responses: { '200': { description: Liste } } }
    post: { tags: [Leçons], summary: 'Créer une leçon', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }, responses: { '201': { description: Créée } } }
  /courses/{courseId}/lessons/reorder:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
