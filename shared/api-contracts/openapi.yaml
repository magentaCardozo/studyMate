    post: { tags: [Leçons], summary: 'Marquer terminée ({ completed: false } pour annuler)', responses: { '200': { description: OK } } }

  /documents:
    get:
      tags: [Documents]
      summary: 'Lister (filtres courseId, folderId, q)'
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Liste paginée } }
  /documents/allowed-types:
    get: { tags: [Documents], summary: 'Types et taille acceptés', responses: { '200': { description: OK } } }
  /documents/upload-url:
    post:
      tags: [Documents]
      summary: '1. Demander une URL d’import signée (15 min)'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, fileSize]
              description: courseId (dossier) ou folderId (sous-dossier) obligatoire — sinon 400 FOLDER_REQUIRED.
              properties:
                fileName: { type: string }
                mimeType: { type: string }
                fileSize: { type: integer }
                courseId: { type: string }
                folderId: { type: string }
                source: { type: string, enum: [file, scan], default: file }
      responses:
        '201': { description: '{ document, upload: { method: PUT, url, headers, expiresAt } }' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /documents/text:
    post:
      tags: [Documents]
      summary: Ajouter du texte copié-collé à la base de connaissances d'un dossier
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 200 }
                content: { type: string, maxLength: 500000 }
                courseId: { type: string, description: Dossier (ou folderId) }
                folderId: { type: string }
      responses:
        '201': { description: 'Document texte créé (source = text), traitement lancé' }
        '400': { $ref: '#/components/responses/Error' }
  /uploads/{token}:
    put:
      tags: [Documents]
      security: []
      summary: '2. Envoyer le fichier (corps binaire). La signature binaire est vérifiée.'
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { '204': { $ref: '#/components/responses/NoContent' }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
